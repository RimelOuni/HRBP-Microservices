version: "3.9"

# ══════════════════════════════════════════════════════════════════
#  MongoDB est sur Atlas → pas de container mongo ici
#
#  Lancer :  docker-compose up --build
#  Logs :    docker-compose logs -f alert-service
#  Arrêter : docker-compose down
# ══════════════════════════════════════════════════════════════════

services:

  alert-service:
    build: .
    container_name: alert-service
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      PORT: 3010
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      POINT_SERVICE_URL: ${POINT_SERVICE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
