
# backend/api-gateway/src/main/resources/application.properties

server.port=8081
spring.application.name=api-gateway

# Gateway
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Collaborateur
springdoc.swagger-ui.urls[0].url=/v3/api-docs/collaborateur-service
springdoc.swagger-ui.urls[1].name=Manager
springdoc.swagger-ui.urls[1].url=/v3/api-docs/manager-service
springdoc.swagger-ui.urls[2].name=HRBP
springdoc.swagger-ui.urls[2].url=/v3/api-docs/hrbp-service