services:
  # ==========================================
  # PostgreSQL pour Keycloak
  # ==========================================
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Keycloak
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8180
    ports:
      - "8181:8180"   # Changed: host 8181 → container 8180
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - microservices-network
    volumes:
      - keycloak_data:/opt/keycloak/data

  # ==========================================
  # PostgreSQL pour le service User
  # ==========================================
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service_pass
    volumes:
      - user_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - microservices-network

  # ==========================================
  # User Service
  # ==========================================
  user-service:
    build: ../user-service
    container_name: user-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_service
      SPRING_DATASOURCE_USERNAME: user_service
      SPRING_DATASOURCE_PASSWORD: user_service_pass
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://keycloak:8180/realms/hrbp-llms/protocol/openid-connect/certs
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      KEYCLOAK_AUTH-SERVER-URL: http://keycloak:8180
      KEYCLOAK_REALM: hrbp-llms
      KEYCLOAK_ADMIN-CLIENT-ID: frontend-client
      KEYCLOAK_ADMIN-CLIENT-SECRET: mkqoljQy1nukBP9sH3cZ8xl1Q8LLcTrn
      KEYCLOAK_FRONTEND-CLIENT-ID: user-service-admint
    depends_on:
      - user-db
      - keycloak
    networks:
      - microservices-network

volumes:
  keycloak_db_data:
  keycloak_data:
  user_db_data:

networks:
  microservices-network:
    driver: bridge