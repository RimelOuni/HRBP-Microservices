services:

  # ══════════════════════════ DISCOVERY ══════════════════════════
  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - microservices-network

  # ══════════════════════════ INFRA (Keycloak + Postgres) ══════════════════════════
  keycloak-db:
    image: postgres:16-alpine
    container_name: core-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: core-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://core-keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - microservices-network
    volumes:
      - keycloak_data:/opt/keycloak/data

  user-db:
    image: postgres:16-alpine
    container_name: core-user-db
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service_pass
    volumes:
      - user_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - microservices-network

  eval-db:
    image: postgres:16-alpine
    container_name: core-eval-db
    environment:
      POSTGRES_DB: eval_service
      POSTGRES_USER: eval_service
      POSTGRES_PASSWORD: eval_service_pass
    volumes:
      - eval_db_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    networks:
      - microservices-network

  # ══════════════════════════ SERVICES JAVA ══════════════════════════
  user-service:
    build: ./user-service
    container_name: core-user-service
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-user-db:5432/user_service
      SPRING_DATASOURCE_USERNAME: user_service
      SPRING_DATASOURCE_PASSWORD: user_service_pass
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://core-keycloak:8180/realms/entreprise-realm/protocol/openid-connect/certs
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      KEYCLOAK_AUTH-SERVER-URL: http://core-keycloak:8180
      KEYCLOAK_REALM: entreprise-realm
      KEYCLOAK_ADMIN-CLIENT-ID: user-service-admin
      KEYCLOAK_ADMIN-CLIENT-SECRET: CHANGE_ME_FROM_KEYCLOAK_CREDENTIALS_TAB
      KEYCLOAK_FRONTEND-CLIENT-ID: frontend-client
    depends_on:
      - user-db
      - keycloak
      - discovery-service
    networks:
      - microservices-network

  eval-service:
    build: ./Eval
    container_name: core-eval-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-eval-db:5432/eval_service
      SPRING_DATASOURCE_USERNAME: eval_service
      SPRING_DATASOURCE_PASSWORD: eval_service_pass
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://core-keycloak:8180/realms/entreprise-realm/protocol/openid-connect/certs
    depends_on:
      - eval-db
      - keycloak
      - discovery-service
    networks:
      - microservices-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8081:8081"
    depends_on:
      - discovery-service
      - keycloak
    networks:
      - microservices-network

  # ══════════════════════════ SERVICES NODE ══════════════════════════
  # Note : USER_SERVICE_URL pointe vers le MONOLITHE Node (port 5000),
  # pas vers le nouveau user-service Java (8088) — via host.docker.internal
  # car le monolithe tourne hors Docker, sur la machine hôte.

  practice-service:
    build: ./practice-service
    container_name: practice-service
    ports:
      - "3005:3005"
    env_file: ./practice-service/.env
    environment:
      USER_SERVICE_URL: http://host.docker.internal:5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - discovery-service
    networks:
      - microservices-network

  project-service:
    build: ./project-service
    container_name: project-service
    ports:
      - "3006:3006"
    env_file: ./project-service/.env
    environment:
      PRACTICE_SERVICE_URL: http://host.docker.internal:3005
      USER_SERVICE_URL: http://host.docker.internal:5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - discovery-service
      - practice-service
    networks:
      - microservices-network

  point-service:
    build: ./point-service
    container_name: point-service
    ports:
      - "3007:3007"
    env_file: ./point-service/.env
    environment:
      USER_SERVICE_URL: http://host.docker.internal:5000
      PRACTICE_SERVICE_URL: http://practice-service:3005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - discovery-service
      - practice-service
    networks:
      - microservices-network

  survey-service:
    build: ./survey-service
    container_name: survey-service
    ports:
      - "3008:3008"
    env_file: ./survey-service/.env
    environment:
      USER_SERVICE_URL: http://host.docker.internal:5000
      PRACTICE_SERVICE_URL: http://practice-service:3005
      BADGE_SERVICE_URL: http://badge-service:3011
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - discovery-service
      - practice-service
      - badge-service
    networks:
      - microservices-network

  action-service:
    build: ./action-service
    container_name: action-service
    ports:
      - "3009:3009"
    env_file: ./action-service/.env
    environment:
      USER_SERVICE_URL: http://host.docker.internal:5000
      POINT_SERVICE_URL: http://point-service:3007
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - discovery-service
      - point-service
    networks:
      - microservices-network

  alert-service:
    build: ./alert-service
    container_name: alert-service
    ports:
      - "3010:3010"
    env_file: ./alert-service/.env
    environment:
      USER_SERVICE_URL: http://host.docker.internal:5000
      POINT_SERVICE_URL: http://point-service:3007
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - discovery-service
      - point-service
    networks:
      - microservices-network

  badge-service:
    build: ./badge-service
    container_name: badge-service
    ports:
      - "3011:3011"
    env_file: ./badge-service/.env
    environment:
      USER_SERVICE_URL: http://host.docker.internal:5000
      PRACTICE_SERVICE_URL: http://practice-service:3005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - discovery-service
      - practice-service
    networks:
      - microservices-network

  satisfaction-service:
    build: ./satisfaction-service
    container_name: satisfaction-service
    ports:
      - "3014:3014"
    env_file: ./satisfaction-service/.env
    environment:
      USER_SERVICE_URL: http://host.docker.internal:5000
      PRACTICE_SERVICE_URL: http://practice-service:3005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - discovery-service
      - practice-service
    networks:
      - microservices-network

  pointrequest-service:
    build: ./pointrequest-service
    container_name: pointrequest-service
    ports:
      - "3015:3015"
    env_file: ./pointrequest-service/.env
    environment:
      USER_SERVICE_URL: http://host.docker.internal:5000
      PRACTICE_SERVICE_URL: http://practice-service:3005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - discovery-service
      - practice-service
    networks:
      - microservices-network

  reclamation-service:
    build: ./reclamation-service
    container_name: reclamation-service
    ports:
      - "3016:3016"
    env_file: ./reclamation-service/.env
    environment:
      USER_SERVICE_URL: http://host.docker.internal:5000
      PRACTICE_SERVICE_URL: http://practice-service:3005
      POINT_SERVICE_URL: http://point-service:3007
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - discovery-service
      - practice-service
      - point-service
    networks:
      - microservices-network

  mood-service:
    build: ./mood-service
    container_name: mood-service
    ports:
      - "3018:3018"
    env_file: ./mood-service/.env
    environment:
      USER_SERVICE_URL: http://host.docker.internal:5000
      PRACTICE_SERVICE_URL: http://practice-service:3005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - discovery-service
      - practice-service
    networks:
      - microservices-network

volumes:
  keycloak_db_data:
  keycloak_data:
  user_db_data:
  eval_db_data:

networks:
  microservices-network:
    driver: bridge