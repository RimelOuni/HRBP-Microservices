version: "3.9"

services:
  pointrequest-service:
    build: .
    container_name: pointrequest-service
    restart: unless-stopped
    ports:
      - "3015:3015"
    environment:
      PORT: 3015
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      PRACTICE_SERVICE_URL: ${PRACTICE_SERVICE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3015/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s