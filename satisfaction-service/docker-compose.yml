version: "3.9"

services:
  satisfaction-service:
    build: .
    container_name: satisfaction-service
    restart: unless-stopped
    ports:
      - "3014:3014"
    environment:
      PORT: 3014
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3014/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s